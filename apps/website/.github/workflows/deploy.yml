# Staging on every push to main, then production after a person approves the `production`
# environment (Settings → Environments → production → required reviewers).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and vars STAGING_URL and
# PRODUCTION_URL. Optional secret ALERT_WEBHOOK_URL: a failed production deploy posts there.
# Skipped until CLOUDFLARE_ACCOUNT_ID is set, so a fresh fork stays green.
#
# The smoke test calls /api/health, which answers 503 unless every required setting is set, APP_URL
# is the URL being tested, and D1 answers. Migrations run before the new code and a failed smoke test
# rolls back the code only, never the database: keep every migration additive (add tables, columns
# and indexes; drop or rename only in a later deploy, once no running version reads the old shape).
name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: deploy
jobs:
  staging:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '"db:migrate:staging"' package.json; then bun run db:migrate:staging; fi
          bun run deploy:staging
      - name: Smoke test
        run: curl --fail-with-body --retry 5 --retry-delay 3 "${{ vars.STAGING_URL }}/api/health"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '"db:migrate:remote"' package.json; then bun run db:migrate:remote; fi
          bun run deploy
      - name: Smoke test, rolling back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if ! curl --fail-with-body --retry 5 --retry-delay 3 "${{ vars.PRODUCTION_URL }}/api/health"; then
            # Alert first: if the rollback fails too, the step exits before anything after it.
            if [ -n "$ALERT_WEBHOOK_URL" ]; then
              curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' \
                -d '{"text":"production deploy failed its smoke test; rolling back","content":"production deploy failed its smoke test; rolling back"}' "$ALERT_WEBHOOK_URL" || true
            fi
            bunx wrangler rollback --message "smoke test failed" -y
            exit 1
          fi
