# Staging on every push to main, then production after a person approves the `production`
# environment (Settings → Environments → production → required reviewers).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and vars STAGING_URL and
# PRODUCTION_URL. Skipped until CLOUDFLARE_ACCOUNT_ID is set, so a fresh fork stays green.
name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency: deploy
jobs:
  staging:
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '"db:migrate:staging"' package.json; then bun run db:migrate:staging; fi
          bun run deploy:staging
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 3 "${{ vars.STAGING_URL }}/api/health"

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '"db:migrate:remote"' package.json; then bun run db:migrate:remote; fi
          bun run deploy
      - name: Smoke test, rolling back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! curl --fail --retry 5 --retry-delay 3 "${{ vars.PRODUCTION_URL }}/api/health"; then
            bunx wrangler rollback --message "smoke test failed" -y
            exit 1
          fi
