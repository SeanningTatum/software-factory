# A pull request into staging is squashed, so its title becomes the commit on staging. This holds
# the title to the rule .husky/commit-msg holds a local commit to. `edited` runs it again when
# the title changes. .github/rulesets/staging.json requires this job.
name: title
on:
  pull_request:
    branches: [staging]
    types: [opened, edited, reopened, synchronize]
permissions: {}
concurrency:
  group: title-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .husky
      - name: The title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          sh .husky/commit-msg "$RUNNER_TEMP/title"
