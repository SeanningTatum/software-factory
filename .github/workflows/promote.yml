# Production takes only staging, and only when its last commit carries a version tag:
#   git tag v2026.11.25 origin/staging && git push origin v2026.11.25
# Tag first, then open the pull request; after a late tag, re-run this job.
#
# This job lives alone, and has no `if`, on purpose. GitHub counts a skipped job as passed. A push
# to staging runs check.yml on the very commit a promotion starts from, so a job there that
# skipped on pushes would show green on the promotion before it ever ran.
name: promote
on:
  pull_request:
    branches: [production]
permissions: {}
jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # brings the tags
      - name: From staging, with a version tag
        env:
          HEAD: ${{ github.head_ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" != true ] || [ "$HEAD" != staging ]; then
            echo "::error::Only this repository's staging branch merges into production."; exit 1
          fi
          if [ -z "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "::error::No version tag on $(git rev-parse --short HEAD). Run: git tag v2026.11.25 origin/staging && git push origin v2026.11.25"; exit 1
          fi
