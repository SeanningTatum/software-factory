name: release
on:
  push:
    branches: [main]
permissions: {}
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    # The version PR needs contents and pull-requests; publishing uses NPM_TOKEN.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: harness
        run: echo "sha=$(git rev-parse HEAD:claude)" >> "$GITHUB_OUTPUT"
      # claude/ is the private claude-config repo, and the CLI must not ship without it. Its own
      # checkout keeps the token to this one read; with no token, this step fails the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SeanningTatum/claude-config
          ref: ${{ steps.harness.outputs.sha }}
          path: claude
          token: ${{ secrets.CLAUDE_CONFIG_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # changesets/action v2 no longer writes .npmrc from NPM_TOKEN; setup-node writes one that
      # reads NODE_AUTH_TOKEN.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache restored into the job that holds NPM_TOKEN
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bun run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
