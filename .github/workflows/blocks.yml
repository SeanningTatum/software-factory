name: blocks
# The feature matrix, on pull requests into staging that touch what it proves.
# Not a required check there: a workflow with a paths filter never reports on the pull requests it
# skips. Every push to staging runs it, though, and production requires all eight on its commit.
on:
  pull_request:
    branches: [staging]
    paths: ["templates/**", "packages/**", "apps/cli/**"]
  push:
    branches: [staging]
permissions: {}
jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        combo: [required, db, auth, billing, kv, workflows, uploads, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' build
      - run: bun run --cwd apps/cli bundle
      - run: bun run --cwd apps/cli test:matrix -- "$RUNNER_TEMP/matrix" --only ${{ matrix.combo }}
