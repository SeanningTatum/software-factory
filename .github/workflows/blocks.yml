name: blocks
on:
  pull_request:
    paths: ["templates/**", "packages/**", "apps/cli/**"]
  push:
    branches: [main]
permissions: {}
jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        combo: [required, db, auth, billing, kv, workflows, uploads, all]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter './packages/*' build
      - run: bun run --cwd apps/cli bundle
      - run: bun run --cwd apps/cli test:matrix -- "$RUNNER_TEMP/matrix" --only ${{ matrix.combo }}
