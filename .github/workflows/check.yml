# The full checks: every pull request into staging, and every push to staging. Production gets
# no pull requests: it takes a staging commit these jobs already passed on.
# A pull request stacked on another branch gets the short checks in pr.yml instead, until it is
# rolled up into staging. .github/rulesets/ makes these jobs required on both branches; keep a
# job's name and its ruleset entry the same. The template ships the same model to new projects.
name: check
on:
  pull_request:
    branches: [staging]
    # When a stacked pull request's parent merges, GitHub points it at staging but starts nothing:
    # push to it (a rebase does) or close and reopen it. `edited` would catch the retarget, and
    # also restart every check on each edit of the description.
  push:
    branches: [staging]
permissions: {}
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to write the size table into the pull request's description
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      # bun links a package's bin only if its file exists, and cf-saas-lint's bin is in dist/:
      # build the packages, then install again to link it.
      - run: bunx turbo run build --filter='./packages/*'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: The template stays under its size budgets
        run: bun run --cwd templates/saas-starter size --markdown="$RUNNER_TEMP/template.md"
      - name: Size table in the pull request's description
        # Every pull request here is on its way to a release, so each shows what it will ship.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for app in template; do
            if test -s "$RUNNER_TEMP/$app.md"; then printf '### %s\n\n%s\n\n' "$app" "$(cat "$RUNNER_TEMP/$app.md")"; fi
          done > "$RUNNER_TEMP/tables.md"
          test -s "$RUNNER_TEMP/tables.md" || exit 0
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          perl -0pi -e 's/\n*<!-- size:start -->.*?<!-- size:end -->\n?//s' "$RUNNER_TEMP/body.md"
          { cat "$RUNNER_TEMP/body.md"; printf '\n\n<!-- size:start -->\n## Size\n\n'; cat "$RUNNER_TEMP/tables.md"
            printf '\nBudgets live in `size-budgets.json`. CI rewrites this section on each push.\n<!-- size:end -->\n'; } > "$RUNNER_TEMP/new.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/new.md"
      - name: No package with a known high or critical hole
        run: bun audit --audit-level=high
      - name: Migrations match the schema
        # db:generate writes a file only when a schema.ts changed and its migration was not made.
        run: |
          bun run --cwd templates/saas-starter db:generate unnamed
          if [ -n "$(git status --porcelain -- '*/drizzle/*')" ]; then
            git status --porcelain -- '*/drizzle/*'
            echo "::error::A schema changed without a migration. See the migration rule in CLAUDE.md."
            exit 1
          fi

  # The template's Playwright specs, against `vite dev` with local D1, R2 and KV.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: templates/saas-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run --filter './packages/*' build
        working-directory: .
      - run: bunx playwright install --with-deps chromium
      - name: Local settings
        # .dev.vars is not committed. Start from the example and give auth a throwaway secret.
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .dev.vars
      - run: bun run db:migrate:local
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: templates/saas-starter/test-results/
          retention-days: 7

  # The CLI tools run on users' machines, Windows included: their path handling is tested there.
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # The template's postinstall (wrangler types) is not what this job tests.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run --cwd packages/lint build
      - run: bun run --cwd packages/lint test
      - run: bun run --cwd packages/blocks test

  # A pull request's own commits must hold no keys; a push to staging checks the files as they stand.
  # Build a test value that looks like a key from parts, as redact.test.ts does. An allow comment
  # quiets gitleaks but not GitHub, whose push protection refuses the whole push.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No allowed keys in the template
        # A new project's first push goes through GitHub's push protection, which ignores this
        # comment and refuses the push.
        run: |
          if git grep -n "gitleaks:allow" -- templates ':!*.md'; then
            echo "::error::Build the value from parts instead of allowing it; see redact.test.ts."; exit 1
          fi
      - name: No keys in the code
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then scan=(git /repo "--log-opts=origin/$BASE..HEAD"); else scan=(dir /repo); fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 "${scan[@]}" --redact --no-banner
