# Opens a pull request each week for outdated packages and actions; CI checks each one.
# Minor and patch bumps come as one pull request; a major bump gets its own.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      packages:
        update-types: [minor, patch]
  # Outside "/", Dependabot reads the .yml files in the folder itself, so name the workflow folders.
  - package-ecosystem: github-actions
    directories:
      - /
      - /templates/saas-starter/.github/workflows
      - /apps/website/.github/workflows
    schedule:
      interval: weekly
