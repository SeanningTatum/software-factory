# The full checks: every pull request into staging, and every push to staging. Production gets
# no pull requests: it takes a staging commit these jobs already passed on.
# A pull request stacked on another branch gets the short checks in pr.yml instead, until it is
# rolled up into staging. .github/rulesets/ makes these jobs required; keep a job's name and its
# ruleset entry the same. A job that can skip (timeline, on a push) is required on staging only:
# GitHub counts a skipped job as passed.
name: ci
on:
  pull_request:
    branches: [staging]
    # labeled/unlabeled re-run the timeline gate when someone adds or drops `no-timeline`.
    # When a stacked pull request's parent merges, GitHub points it at staging but starts nothing:
    # push to it (a rebase does) or close and reopen it. `edited` would catch the retarget, and
    # also restart every check on each edit of the description.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [staging]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to write the size table into the pull request's description
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Pages and the Worker stay under size-budgets.json
        run: bun run size --markdown="$RUNNER_TEMP/size.md"
      - name: Size table in the pull request's description
        # Every pull request here is on its way to production, so each shows what it will ship.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          test -s "$RUNNER_TEMP/size.md" || exit 0; cp "$RUNNER_TEMP/size.md" "$RUNNER_TEMP/tables.md"
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          perl -0pi -e 's/\n*<!-- size:start -->.*?<!-- size:end -->\n?//s' "$RUNNER_TEMP/body.md"
          { cat "$RUNNER_TEMP/body.md"; printf '\n\n<!-- size:start -->\n## Size\n\n'; cat "$RUNNER_TEMP/tables.md"
            printf '\nBudgets live in `size-budgets.json`. CI rewrites this section on each push.\n<!-- size:end -->\n'; } > "$RUNNER_TEMP/new.md"
          gh pr edit "$PR" --body-file "$RUNNER_TEMP/new.md"
      - name: No package with a known high or critical hole
        run: bun audit --audit-level=high
      - name: Migrations match the schema
        # db:generate writes a file only when a schema.ts changed and its migration was not made.
        run: |
          if grep -q '"db:generate"' package.json; then
            bun run db:generate unnamed
            if [ -n "$(git status --porcelain -- drizzle)" ]; then
              git status --porcelain -- drizzle
              echo "::error::A schema changed without a migration. Run bun run db:generate <what_changed> and commit drizzle/."
              exit 1
            fi
          fi

  # A pull request's own commits must hold no keys; a push to staging checks the files as they stand.
  # Build a test value that looks like a key from parts, as redact.test.ts does. An allow comment
  # quiets gitleaks but not GitHub, whose push protection refuses the whole push.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No keys in the code
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then scan=(git /repo "--log-opts=origin/$BASE..HEAD"); else scan=(dir /repo); fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 "${scan[@]}" --redact --no-banner

  # The Playwright specs in each feature's e2e folder, against `vite dev` with local D1, R2 and KV.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run playwright install --with-deps chromium
      - name: Local settings
        # .dev.vars is not committed. Start from the example and give auth a throwaway secret.
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .dev.vars
      - name: Migrate the local database
        run: if grep -q '"db:migrate:local"' package.json; then bun run db:migrate:local; fi
      - run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Every feature a pull request changes needs a new line in its TIMELINE.md.
  # Label the pull request `no-timeline` to skip this for a trivial change.
  timeline:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run cf-saas-lint timeline --base "origin/${{ github.base_ref }}"
        env:
          TIMELINE_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-timeline') && '1' || '' }}
