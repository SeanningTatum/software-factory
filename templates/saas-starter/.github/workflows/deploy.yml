# A push to staging deploys staging; a push to production deploys production. Production moves
# only by a fast-forward push of a staging commit (docs/branches.md has the command), and deploys
# it only when it carries a version tag: the production job checks both first. For a second stop,
# give the `production` environment required reviewers (Settings → Environments → production).
# Needs the repository secret CLOUDFLARE_API_TOKEN and the repository variables CLOUDFLARE_ACCOUNT_ID,
# STAGING_URL and PRODUCTION_URL (Settings → Variables, not Secrets). Optional secret
# ALERT_WEBHOOK_URL: a failed production deploy posts there.
# `bunx create-tanstack-cf-saas github` sets all four from wrangler's login and each environment's
# APP_URL, and asks for the token.
# Skipped until the variable CLOUDFLARE_ACCOUNT_ID is set, so a fresh fork stays green.
#
# The smoke test calls /api/health, which answers 503 unless every required setting is set, APP_URL
# is the URL being tested, and D1 answers. Migrations run before the new code and a failed smoke test
# rolls back the code only, never the database: keep every migration additive (add tables, columns
# and indexes; drop or rename only in a later deploy, once no running version reads the old shape).
name: deploy
on:
  push:
    branches: [staging, production]
permissions:
  contents: read
concurrency: deploy-${{ github.ref_name }}
jobs:
  # A required check on production (.github/rulesets/production.json): production takes a staging
  # commit only once that commit's own deploy and smoke test here have passed.
  staging:
    if: ${{ github.ref_name == 'staging' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '"db:migrate:staging"' package.json; then bun run db:migrate:staging; fi
          bun run deploy:staging
      - name: Smoke test
        run: |
          curl --fail-with-body --retry 5 --retry-delay 3 --max-time 15 "${{ vars.STAGING_URL }}/api/health"
          # A CSP with a nonce is sent only by a production build, so only a deploy can see it break.
          csp() {
            curl -sS --max-time 15 -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/b" "$1/" || return 1
            n=$(tr -d '\r' < "$RUNNER_TEMP/h" | grep -i '^content-security-policy:' | grep -o "'nonce-[^']*'" | head -1 | cut -c8- | tr -d "'")
            test -n "$n" || { echo "no nonce in the content-security-policy header"; return 1; }
            ! tr '\n' ' ' < "$RUNNER_TEMP/b" | grep -o '<script[^>]*>' | grep -vF "nonce=\"$n\""
          }
          csp "${{ vars.STAGING_URL }}"

  production:
    # !created: the push that makes the branch deploys nothing; the first promotion does.
    if: ${{ github.ref_name == 'production' && !github.event.created && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # brings the tags and origin/staging
      # The ruleset lets any commit that passed its checks fast-forward production. Deploy only a
      # promotion: a commit that is on staging and carries a version tag.
      - name: On staging, with a version tag
        run: |
          if ! git merge-base --is-ancestor HEAD origin/staging; then
            echo "::error::$(git rev-parse --short HEAD) is not on staging. Production takes staging's commits only: see docs/branches.md."; exit 1
          fi
          if [ -z "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "::error::No version tag on $(git rev-parse --short HEAD). Run: git push origin $(git rev-parse HEAD):refs/tags/v1.2.0, then re-run this job."; exit 1
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Migrate and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if grep -q '"db:migrate:remote"' package.json; then bun run db:migrate:remote; fi
          bun run deploy
      - name: Smoke test, rolling back on failure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          # A CSP with a nonce is sent only by a production build, so only a deploy can see it break.
          csp() {
            curl -sS --max-time 15 -D "$RUNNER_TEMP/h" -o "$RUNNER_TEMP/b" "$1/" || return 1
            n=$(tr -d '\r' < "$RUNNER_TEMP/h" | grep -i '^content-security-policy:' | grep -o "'nonce-[^']*'" | head -1 | cut -c8- | tr -d "'")
            test -n "$n" || { echo "no nonce in the content-security-policy header"; return 1; }
            ! tr '\n' ' ' < "$RUNNER_TEMP/b" | grep -o '<script[^>]*>' | grep -vF "nonce=\"$n\""
          }
          if ! { curl --fail-with-body --retry 5 --retry-delay 3 --max-time 15 "${{ vars.PRODUCTION_URL }}/api/health" && csp "${{ vars.PRODUCTION_URL }}"; }; then
            # Alert first: if the rollback fails too, the step exits before anything after it.
            if [ -n "$ALERT_WEBHOOK_URL" ]; then
              curl -sS --max-time 10 -X POST -H 'Content-Type: application/json' \
                -d '{"text":"production deploy failed its smoke test; rolling back","content":"production deploy failed its smoke test; rolling back"}' "$ALERT_WEBHOOK_URL" || true
            fi
            bunx wrangler rollback --message "smoke test failed" -y
            exit 1
          fi
