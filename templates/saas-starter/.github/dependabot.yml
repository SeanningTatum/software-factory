# Opens a pull request each week for outdated packages and actions; CI checks each one.
# Minor and patch bumps come as one pull request; a major bump gets its own.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      packages:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
